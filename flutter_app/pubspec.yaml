name: examora
description: Examora — SSC CGL AI Academy (Learn. Play. Practice. Achieve.)
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_storage: ^12.4.1
  cloud_functions: ^5.3.1
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  lottie: ^3.2.1
  video_player: ^2.9.2
  file_picker: ^8.1.7
  excel: ^4.0.6
  csv: ^6.0.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ocean_sunrays.jpg
    - assets/data/ssc_cgl_past_papers_2016_2026.json
    - assets/data/ai_generated_practice.json
